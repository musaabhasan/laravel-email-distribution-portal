services:
  app:
    build:
      context: .
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://127.0.0.1:8088
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: email_distribution_portal
      DB_USERNAME: portal
      DB_PASSWORD: portal_password
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      SESSION_DRIVER: database
      MAIL_MAILER: log
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy

  scheduler:
    build:
      context: .
    command: ["php", "artisan", "schedule:work"]
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_DATABASE: email_distribution_portal
      DB_USERNAME: portal
      DB_PASSWORD: portal_password
      MAIL_MAILER: log
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8088:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: email_distribution_portal
      MYSQL_USER: portal
      MYSQL_PASSWORD: portal_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "33068:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
